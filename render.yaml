services:
  - type: web
    name: bus-eodiga-api
    runtime: python
    rootDir: drt_simulator
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: STORE_BACKEND
        value: firestore
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: ENABLE_DEMO_DISPATCH
        value: "true"
      - key: DEMO_GROUP_SIZE
        value: "3"
      - key: DEMO_MIN_REQUEST_COUNT
        value: "2"
      - key: DEMO_QUEUE_TTL_SECONDS
        value: "180"
      - key: DEMO_AUTO_SIMULATION
        value: "true"
      - key: DEMO_TRAVEL_SECONDS
        value: "5"
      - key: DEMO_DWELL_SECONDS
        value: "2"
      - key: HARDWARE_VEHICLE_CONTROL_ENABLED
        value: "false"
      - key: MODI_KIOSK_API_ENABLED
        value: "true"
      - key: MODI_KIOSK_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
